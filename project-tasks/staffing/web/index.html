<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泰国 Araya 项目人员储备 · 海外运维协作平台</title><link rel="icon" href="/assets/vnet-favicon.svg"><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/platform-navigation.css"><link rel="stylesheet" href="/src/staffing.css"></head>
<body class="staffing-page"><div id="platformHeader"></div><header class="staffing-hero"><div><a href="/project-management" class="staffing-back">← 项目管理</a><h1 id="staffingTitle">泰国 Araya 项目人员储备</h1></div><div class="staffing-sync"><span id="syncTime"></span><button id="refresh" class="staffing-sync-button" type="button" aria-label="同步后台数据" title="同步后台数据" aria-busy="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 19 9l1 3M4 12l1 3a8 8 0 0 0 12.9 2.9"/></svg></button><a id="baseLink" target="_blank" rel="noopener" hidden>底表</a></div></header>
<main class="staffing-main" id="main" data-state="loading"><div id="message" role="status" aria-live="polite">正在加载人员储备…</div><section class="staffing-kpis" id="kpis" aria-label="人员储备概况"></section><div class="staffing-toolbar"><nav class="staffing-tabs" aria-label="储备视图"><button type="button" data-tab="overview" aria-pressed="true">储备总览</button><button type="button" data-tab="positions" aria-pressed="false">岗位与储备</button><button type="button" data-tab="people" aria-pressed="false">人员清单</button></nav><label>项目<select id="project"><option value="">全部项目</option><option value="泰国A项目" selected>泰国 Araya</option><option>马来西亚项目</option></select></label></div>
<section id="overview" class="staffing-overview-grid"><article class="staffing-card staffing-timeline-card"><div class="staffing-card-head"><h2>需求到岗节奏</h2><span class="staffing-caption" id="timelineYear">人</span></div><div id="timeline" class="staffing-timeline"></div></article><article class="staffing-card staffing-employment-card"><div class="staffing-card-head"><h2>用工构成</h2><span class="staffing-caption">人</span></div><div id="employment" class="staffing-composition"></div></article><article class="staffing-card staffing-gap-card"><div class="staffing-card-head"><h2>岗位缺口</h2><span class="staffing-caption">人</span></div><div id="roles" class="staffing-gap-ranking"></div></article></section>
<section id="positions" hidden><article class="staffing-card"><div class="staffing-card-head"><div><h2>岗位与储备</h2><p id="positionSummary"></p></div><div class="staffing-position-tabs" aria-label="岗位分组"><button type="button" data-position-group="building" aria-pressed="true">园区 / 楼栋</button><button type="button" data-position-group="profession" aria-pressed="false">专业</button></div></div><div id="positionRows"></div></article><article class="staffing-card staffing-supply-card"><div class="staffing-card-head"><div><h2>储备分布</h2></div><label>分布维度<select id="supplyGroup"><option value="region">所在区域</option><option value="site">所在机房</option></select></label></div><div id="supply"></div></article></section>
<section id="people" hidden><article class="staffing-card"><div class="staffing-card-head"><div><h2>人员储备清单 <span id="peopleCount"></span></h2></div><button type="button" data-person-collapse-all>收起全部</button></div><div class="staffing-project-tabs" id="projectTabs" aria-label="项目快速筛选"></div><div class="staffing-filters"><label class="staffing-search">搜索<input id="search" type="search" placeholder="姓名 / 岗位"></label><label>机房<select id="site"><option value="">全部机房</option></select></label><label>岗位<select id="role"><option value="">全部岗位</option></select></label><label>状态<select id="status"><option value="">全部状态</option></select></label><label>分组<select id="group"><option value="">不分组</option><option value="region" selected>所在区域</option><option value="site">所在机房</option><option value="role">拟定岗位</option><option value="plannedArrival">到岗月份</option></select></label><button type="button" id="clear">清除</button></div><div class="staffing-region-chips" id="regionChips" aria-label="区域快速筛选"></div><div class="staffing-active-filters" id="activeFilters" aria-live="polite"></div><div class="staffing-table-wrap" tabindex="0" aria-label="人员清单，可横向滚动"><table class="staffing-table"><thead><tr><th>姓名</th><th>拟定岗位 / 当前岗位</th><th>所在区域</th><th>所在机房</th><th>项目 / 原意向地</th><th>计划到岗</th><th>跟进状态</th><th>负责人</th><th>确认到岗日期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></article></section>

</main>
<dialog id="editor" class="staffing-dialog" aria-labelledby="editorTitle"><form id="editForm"><div class="staffing-dialog-head"><div><h2 id="editorTitle"></h2></div><button type="button" id="closeEditor" aria-label="关闭">×</button></div><p id="editorContext"></p><div id="editMessage" role="status" aria-live="polite"></div><fieldset id="editFields"><label>跟进状态<select name="status" required></select></label><label>跟进负责人<select name="owner"></select></label><label>确认到岗日期<input name="actualArrival" type="date"></label><label class="staffing-notes">跟进说明<textarea name="notes" rows="4" maxlength="5000" ></textarea></label></fieldset><div class="staffing-dialog-actions"><button type="button" id="retryOperation" hidden>重试同步</button><button type="submit" id="save">保存跟进</button></div></form></dialog>
<script type="module" src="/src/staffing.js"></script></body></html>
