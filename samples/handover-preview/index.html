<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接维项目工作台 · 本地预览</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="platform-header">
  <a class="brand" href="/project-management-preview" data-home aria-label="项目工作台首页"><img src="/logo.png" alt="世纪互联 VNET"><span>海外业务协作平台</span></a>
  <nav aria-label="主导航"><a class="current" href="/project-management-preview" data-home>项目管理</a><a data-platform-page="/cross-coordination?project=th-001" href="https://localhost:3333/cross-coordination?project=th-001" target="_blank" rel="noreferrer">横向统筹</a><a data-platform-page="/knowledge-sharing?project=thailand" href="https://localhost:3333/knowledge-sharing?project=thailand" target="_blank" rel="noreferrer">知识共享</a><a data-platform-page="/meeting-trail?project=thailand" href="https://localhost:3333/meeting-trail?project=thailand" target="_blank" rel="noreferrer">议事航迹</a></nav>
  <button class="icon-button menu-button" data-action="sidebar" title="打开项目导航" aria-label="打开项目导航">☰</button><span class="preview-tag">本地预览</span>
</header>
<div class="workspace">
  <aside class="sidebar" id="sidebar"><div class="side-title">项目工作台<button class="icon-button mobile-close" data-action="sidebar" title="关闭项目导航" aria-label="关闭项目导航">×</button></div><nav aria-label="项目导航"><div id="workspacePages"></div><div id="ganttStages"><h2>接维阶段</h2><div id="sideStages"></div></div></nav><footer><i></i>泰国 · Araya</footer></aside>
  <div class="content"><main id="main">
    <div id="loadStatus" class="load-state" role="status"><span class="spinner"></span>正在读取接维任务</div>
    <div id="workspaceData" hidden>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="plan-panel" aria-label="项目工作区">
        <div class="panel-heading"><h1 id="workspaceTitle" class="workspace-title">甘特计划</h1><div class="panel-heading-right"><span id="resultsCount" hidden></span><button id="syncButton" class="text-button" data-action="operations" hidden>同步任务</button><button id="trashButton" class="text-button" data-action="trash" hidden>已删除</button><button id="newTaskButton" class="text-button" data-action="new-task">登录编辑</button><div class="command-tools"><span id="sourceStamp" hidden></span><a id="sourceLink" class="command-link" href="https://vnet.feishu.cn/base/CID8b8V7CaCtKesWGFKcHTdqnlc?table=tblgQsrBMFd9eeuX&view=vewkRPw0CG" target="_blank" rel="noreferrer">打开底表 ↗</a><button class="icon-button refresh" data-action="refresh" title="重新读取项目数据" aria-label="重新读取项目数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 8a7 7 0 0 1 11.5-3L20 8M4 16l2.9 3A7 7 0 0 0 18.4 16"/></svg></button></div><button class="text-button" data-action="clear">重置</button></div></div>
        <div class="filters" id="planFilters"><div class="filter-inputs"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索任务、编号、备注" aria-label="搜索任务、编号、备注" autocomplete="off"></label><select id="category" aria-label="工作分类"><option value="">全部分类</option></select><select id="status" aria-label="执行状态"><option value="">全部状态</option><option>未开始</option><option>进行中</option><option>逾期</option><option>已完成</option></select></div><section id="metrics" class="summary-metrics" aria-label="项目指标"></section></div>
        <div id="modeControls" class="mode-controls"></div><div id="board" class="board" aria-live="polite"></div>
      </section>
      <footer class="source-footer"><span id="sourceFooter"></span><span id="writeMode">只读预览</span></footer>
    </div>
  </main></div>
</div>
<dialog id="detailDialog" aria-labelledby="detailTitle"><div id="detailContent"></div></dialog>
<dialog id="taskEditorDialog" class="task-edit-dialog" aria-label="项目计划编辑"></dialog>
<script type="module" src="/app.mjs"></script>
</body></html>
