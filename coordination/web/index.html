<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横向统筹 · 海外业务协作平台</title><link rel="icon" href="/assets/vnet-favicon.svg"><link rel="stylesheet" href="/src/platform-navigation.css"><link rel="stylesheet" href="/src/coordination.css"></head>
<body><div id="platformHeader"></div><main class="coord-workspace"><header class="coord-toolbar"><div class="coord-tools"><button id="pendingWrites" class="coord-icon-button" type="button" title="同步任务" aria-label="同步任务" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button><span id="syncStatus" role="status" aria-live="polite"></span><button id="refresh" class="coord-icon-button" type="button" title="刷新数据" aria-label="刷新数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 4M5 14a8 8 0 0 0 13 4"/></svg></button><a id="sourceLink" class="coord-icon-button" target="_blank" rel="noopener noreferrer" title="打开飞书源表" aria-label="打开飞书源表" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a></div></header>
<p id="message" class="coord-message" role="status" aria-live="polite" hidden></p><p id="writeStatus" class="coord-write-status" role="status" aria-live="polite" hidden></p><section id="summary" class="coord-summary" aria-label="开办物资概况"></section>
<section class="coord-library" aria-label="海外开办物资"><aside class="coord-categories"><section><h2>专业分类</h2><nav id="specialties" aria-label="专业分类"></nav></section><section><h2>物资分类</h2><nav id="categories" aria-label="物资分类"></nav></section></aside><div class="coord-content"><div class="coord-list-heading"><div><h2>开办物资清单</h2><span id="recordCount"></span></div><label class="coord-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索物资、品牌或型号" aria-label="搜索物资、品牌或型号" maxlength="200"></label><button id="newMaterial" hidden class="coord-primary" type="button">＋ 新增</button></div>
<form id="filters" class="coord-filters"><label>一级分类<select name="primary" aria-label="一级分类"></select></label><label>适用区域<select name="region" aria-label="适用区域"></select></label><label>架构<select name="architecture" aria-label="适用架构"></select></label><label>配置方式<select name="level" aria-label="配置方式"></select></label><label>分组<select name="group" aria-label="分组"><option value="specialty-category">专业 / 物资分类</option><option value="specialty">专业</option><option value="category">物资分类</option><option value="classification">一级 / 二级分类</option><option value="level">配置方式</option><option value="region">适用区域</option><option value="none">不分组</option></select></label><button type="button" class="coord-icon-button coord-group-action" data-groups="expand" title="全部展开" aria-label="全部展开"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 8 5-5 5 5M7 16l5 5 5-5M12 3v18"/></svg></button><button type="button" class="coord-icon-button coord-group-action" data-groups="collapse" title="全部收起" aria-label="全部收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 5 5 5-5M7 21l5-5 5 5M12 3v5m0 8v5"/></svg></button><label>每页<select name="pageSize" aria-label="每页条数"><option value="50">50 条</option><option value="100">100 条</option><option value="200">200 条</option></select></label><label class="coord-sort">排序<select name="sort" aria-label="排序"><option value="">序号</option><option value="amount-desc">参考金额从高到低</option><option value="name">物资名称</option></select></label><button class="coord-reset" type="button" id="reset">重置</button></form>
<div class="coord-table-wrap"><table class="coord-table"><colgroup><col class="coord-col-sequence"><col class="coord-col-name"><col class="coord-col-model"><col class="coord-col-requirement"><col class="coord-col-region"><col class="coord-col-level"><col class="coord-col-quantity"><col class="coord-col-price"><col class="coord-col-amount"><col class="coord-col-detail"></colgroup><thead><tr><th scope="col">序号</th><th scope="col">物资名称</th><th scope="col">品牌 / 型号</th><th scope="col">配置要求</th><th scope="col">适用区域</th><th scope="col">配置方式</th><th scope="col" class="numeric">数量</th><th scope="col" class="numeric">参考单价</th><th scope="col" class="numeric">参考金额</th><th scope="col"><span class="sr-only">详情</span></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="coord-empty" hidden></div></div><footer id="pagination" class="coord-pagination" aria-label="分页"></footer></div></section></main>
<dialog id="detail" class="coord-detail" aria-labelledby="detailTitle"></dialog><dialog id="materialEditor" class="coord-editor" aria-labelledby="materialEditorTitle"></dialog><script type="module" src="/src/coordination.js"></script></body></html>
