<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员配置 · 海外运维协作平台</title><link rel="icon" href="/assets/vnet-favicon.svg"><link rel="stylesheet" href="/src/platform-navigation.css"><link rel="stylesheet" href="/src/admin.css"></head>
<body><div id="platformHeader"></div><main class="admin-page"><header class="admin-heading"><h1>管理员配置</h1><a href="/project-management">返回项目</a></header><div id="pageStatus" class="admin-message" role="status" aria-live="polite" hidden></div>
<nav class="admin-tabs" aria-label="管理员配置"><button type="button" data-admin-tab="records" aria-current="page">登录访问</button><button type="button" data-admin-tab="application">应用配置</button><button type="button" data-admin-tab="permissions">鉴权配置</button></nav>
<section id="recordsPanel" aria-label="登录访问"><div id="auditSummary" class="admin-summary"></div><article class="admin-panel"><form id="auditFilters" class="admin-filters"><label class="admin-search"><span class="sr-only">搜索人员或页面</span><input name="q" type="search" maxlength="120" placeholder="搜索人员或页面" autocomplete="off"></label><label><span>起始</span><input name="from" type="date"></label><label><span>截止</span><input name="to" type="date"></label><label><span class="sr-only">同步状态</span><select name="status"><option value="">全部状态</option><option value="synced">已同步</option><option value="pending">待同步</option></select></label><button type="button" id="resetFilters" class="admin-text">重置</button><div class="admin-tools"><span id="auditTime"></span><a id="auditSource" class="admin-icon" title="打开登录记录多维表" aria-label="打开登录记录多维表" target="_blank" rel="noopener noreferrer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 4H4v16h16v-6"/></svg></a><button type="button" id="refreshAudit" class="admin-icon" title="刷新登录记录" aria-label="刷新登录记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button></div></form>
<div class="admin-table-scroll" tabindex="0" aria-label="登录记录"><table class="admin-table"><thead><tr><th>姓名</th><th>登录时间</th><th>退出时间</th><th>进入页面</th><th>登录方式</th><th>同步</th></tr></thead><tbody id="auditRows"><tr><td colspan="6" class="admin-empty">读取中…</td></tr></tbody></table></div><footer class="admin-pagination"><span id="auditTotal"></span><div><label><span class="sr-only">每页条数</span><select id="auditPageSize"><option value="25">25 条/页</option><option value="50">50 条/页</option><option value="100">100 条/页</option></select></label><button type="button" id="auditPrev" aria-label="上一页">‹</button><span id="auditPage"></span><button type="button" id="auditNext" aria-label="下一页">›</button></div></footer></article></section>
<section id="applicationPanel" class="admin-panel admin-application" aria-label="应用配置" hidden><header><h2>飞书应用</h2></header><div id="applicationForm"></div></section><section id="permissionsPanel" class="admin-panel" aria-label="鉴权配置" hidden></section></main><script type="module" src="/src/admin.js"></script></body></html>
